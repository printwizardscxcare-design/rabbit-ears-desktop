name: Windows desktop beta
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package*.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:captions
      - run: npm run build:preload
      - name: Install Electron for the UI check
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - name: Check caption appearance and compact window
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "node_modules/electron/dist/electron.exe"
          $check = Start-Process -FilePath $exe -ArgumentList scripts/check-caption-appearance.cjs -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput appearance.out.log -RedirectStandardError appearance.err.log
          Get-Content appearance.out.log
          Get-Content appearance.err.log
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - run: npx electron-builder --win nsis --x64 --publish never
      - run: node scripts/check-release.cjs
      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist/*-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Rabbit-Ears-stream-Desktop-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*.blockmap
            dist/*.yml
            dist/SHA256SUMS.txt
      - name: Draft tagged beta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Keeping the existing verified release assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME dist/*-Setup.exe dist/*.blockmap dist/beta.yml dist/SHA256SUMS.txt --draft --prerelease --generate-notes

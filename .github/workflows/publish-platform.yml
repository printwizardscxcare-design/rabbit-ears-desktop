name: Publish verified platform downloads
on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Successful installer/check run ID
        required: true
      artifact:
        type: choice
        description: Checked platform artifact
        options:
          - Rabbit-Ears-stream-Desktop-Windows-x64
          - Rabbit-Ears-stream-Desktop-Mac-arm64
          - Rabbit-Ears-stream-Desktop-Mac-x64
          - Rabbit-Ears-stream-Desktop-Linux-x64
        required: true
      tag:
        description: Existing beta release tag
        default: v0.1.0-beta.5
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build-run }}
      ARTIFACT_NAME: ${{ inputs.artifact }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful checks and matching app source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          case "$ARTIFACT_NAME" in
            Rabbit-Ears-stream-Desktop-Windows-x64) expected='.github/workflows/windows.yml'; expected_job='' ;;
            Rabbit-Ears-stream-Desktop-Mac-arm64) expected='.github/workflows/mac.yml'; expected_job='build (macos-15, arm64)' ;;
            Rabbit-Ears-stream-Desktop-Mac-x64) expected='.github/workflows/mac.yml'; expected_job='build (macos-15-intel, x64)' ;;
            Rabbit-Ears-stream-Desktop-Linux-x64) expected='.github/workflows/linux.yml'; expected_job='' ;;
            *) exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build.json
          test "$(jq -r .path build.json)" = "$expected"
          if [ -n "$expected_job" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > jobs.json
            jq -e --arg name "$expected_job" '.jobs[] | select(.name==$name and .conclusion=="success")' jobs.json > /dev/null
          else
            # Linux must pass all three clean-package installation jobs as well.
            test "$(jq -r .conclusion build.json)" = success
          fi
          build_sha=$(jq -r .head_sha build.json)
          test "$(git show "$build_sha:package.json" | jq -r .version)" = "${RELEASE_TAG#v}"
          test "$(git show "$RELEASE_TAG:package.json" | jq -r .version)" = "${RELEASE_TAG#v}"
          git diff --exit-code "$RELEASE_TAG" "$build_sha" -- src assets native scripts package.json package-lock.json .github/workflows/mac.yml .github/workflows/linux.yml .github/workflows/windows.yml ':(exclude)scripts/check-caption-appearance.cjs'
          gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease | grep -qx true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Verify and publish without replacing existing downloads
        shell: bash
        run: |
          set -euo pipefail
          case "$ARTIFACT_NAME" in
            *Windows-x64) manifest=SHA256SUMS.txt ;;
            *Mac-arm64) manifest=SHA256SUMS-Mac-arm64.txt ;;
            *Mac-x64) manifest=SHA256SUMS-Mac-x64.txt ;;
            *Linux-x64) manifest=SHA256SUMS-Linux.txt ;;
          esac
          cd incoming
          # Windows PowerShell writes CRLF checksum lists; normalize only this text manifest.
          if [[ "$ARTIFACT_NAME" == *Windows-x64 ]]; then
            tr -d '\r' < "$manifest" > checksums-normalized.txt
            mv checksums-normalized.txt "$manifest"
          fi
          # Build manifests contain simple release basenames, never filesystem paths.
          awk 'NF != 2 || $1 !~ /^[a-f0-9]+$/ || length($1) != 64 || $2 !~ /^[-A-Za-z0-9._]+$/ {exit 1}' "$manifest"
          sha256sum -c "$manifest"
          mapfile -t files < <(awk '{print $2}' "$manifest")
          files+=("$manifest")
          if [[ "$ARTIFACT_NAME" == *Windows-x64 ]]; then
            # Also verify the update feed and blockmap before publishing the checked Windows build.
            python3 - <<'PY'
          import base64, hashlib, os, pathlib, re
          feed = pathlib.Path('beta.yml').read_text(encoding='utf-8-sig')
          version = os.environ['RELEASE_TAG'][1:]
          assert re.search(r'^version: '+re.escape(version)+r'\s*$', feed, re.M)
          installer = next(pathlib.Path('.').glob('*-Setup.exe'))
          assert installer.name in feed
          expected = re.search(r'^sha512: (\S+)', feed, re.M).group(1)
          digest = hashlib.sha512()
          with installer.open('rb') as handle:
              for chunk in iter(lambda: handle.read(1024*1024), b''):
                  digest.update(chunk)
          assert base64.b64encode(digest.digest()).decode() == expected
          assert pathlib.Path(str(installer)+'.blockmap').stat().st_size > 0
          PY
            files+=("${files[0]}.blockmap" beta.yml)
          fi
          # Drafts are intentionally absent from releases/tags; resolve the authenticated release ID.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name==$tag) | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          for file in "${files[@]}"; do
            if [ "$file" != "$manifest" ] && [ "$file" != beta.yml ]; then
              [[ "$file" == Rabbit-Ears-stream-Desktop-"${RELEASE_TAG#v}"-* ]]
            fi
            local_hash="sha256:$(sha256sum "$file" | cut -d ' ' -f1)"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > /tmp/release.json
            existing=$(jq -r --arg name "$file" '.assets[] | select(.name==$name) | .digest' /tmp/release.json)
            if [ -z "$existing" ]; then
              gh release upload "$RELEASE_TAG" "$file"
            else
              test "$existing" = "$local_hash"
            fi
            remote_hash=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" | jq -r --arg name "$file" '.assets[] | select(.name==$name) | .digest')
            test "$remote_hash" = "$local_hash"
            printf '%s  %s\n' "$local_hash" "$file" >> "$GITHUB_STEP_SUMMARY"
          done
